<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17111f">
  <meta name="description" content="一局刚刚好的贪吃蛇。支持键盘、WASD、手机滑动和方向按钮。">
  <meta property="og:title" content="静静专属 · 贪吃蛇">
  <meta property="og:description" content="越吃越长，别撞到自己。打开网页就能玩。">
  <meta property="og:image" content="https://1796617910-beep.github.io/muyu-gongde/og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>静静专属 · 贪吃蛇</title>
  <link rel="stylesheet" href="./style.css?v=20260730-4">
</head>
<body>
  <main class="snake-shell">
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>
    <div class="app-frame">
      <section class="intro-panel" aria-labelledby="game-title">
        <div class="brand-row"><span class="brand-dot" aria-hidden="true">S</span><span>静静专属</span></div>
        <p class="kicker">CLASSIC GAME · 新鲜开吃</p>
        <h1 id="game-title">越吃越长，<br><em>别撞到自己。</em></h1>
        <p class="intro-copy">一局刚刚好。吃下果实，绕开边界，让这条小蛇长得再长一点。</p>
        <div class="stats" aria-label="游戏数据">
          <div class="stat-card score-card"><span>本局分数</span><strong id="score">00</strong></div>
          <div class="stat-card"><span>最高纪录</span><strong id="best">00</strong></div>
          <div class="stat-card"><span>当前等级</span><strong id="level">01</strong></div>
        </div>
        <div class="desktop-hints" aria-label="操作说明">
          <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>方向</span>
          <span><kbd>Space</kbd>暂停</span>
        </div>
      </section>

      <section class="game-column" aria-label="贪吃蛇游戏区">
        <div class="game-toolbar">
          <div class="live-badge"><span aria-hidden="true"></span><b id="liveText">等待开始</b></div>
          <div class="toolbar-actions">
            <button type="button" class="icon-button" id="soundButton" aria-label="关闭音效" aria-pressed="false">声</button>
            <button type="button" class="text-button" id="restartButton">重新开始</button>
          </div>
        </div>

        <div class="board-card">
          <div class="corner-label top-left" id="levelLabel">LEVEL 01</div>
          <div class="corner-label top-right">22 × 22</div>
          <div class="board-wrap" id="boardWrap">
            <canvas id="gameCanvas" role="img" aria-label="贪吃蛇棋盘，当前分数 0"></canvas>
            <div class="game-overlay" id="overlay" role="status">
              <span id="overlayEyebrow">READY?</span>
              <strong id="overlayTitle">准备好了吗？</strong>
              <p id="overlayHint">按方向键或滑动开始</p>
              <button type="button" id="overlayButton">开始游戏</button>
            </div>
          </div>
          <p class="swipe-hint">手机直接在棋盘上滑动</p>
        </div>

        <div class="mobile-controls" aria-label="方向控制">
          <button type="button" class="control-up" data-direction="up" aria-label="向上">↑</button>
          <button type="button" data-direction="left" aria-label="向左">←</button>
          <button type="button" class="pause-control" id="pauseButton" aria-label="暂停游戏">Ⅱ</button>
          <button type="button" data-direction="right" aria-label="向右">→</button>
          <button type="button" class="control-down" data-direction="down" aria-label="向下">↓</button>
        </div>
      </section>
    </div>
  </main>
  <script src="./game.js?v=20260730-4"></script>
</body>
</html>
